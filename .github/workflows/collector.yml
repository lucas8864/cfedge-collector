name: CFEdge Collector

on:
  workflow_dispatch:

  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

jobs:
  collector:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector
        env:
          HTTP_TIMEOUT: "20"
          ENABLE_ACTIVE_TEST: "false"
          ACTIVE_TEST_LIMIT: "300"
          ACTIVE_TEST_WORKERS: "32"
        run: |
          python collector.py

      - name: Show result
        run: |
          echo "===== Statistics ====="
          cat data/stats.json

          echo
          echo "===== IPv4 ====="
          wc -l data/ip/ipv4.txt || true

          echo
          echo "===== IPv6 ====="
          wc -l data/ip/ipv6.txt || true

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "update collector data"
            git push
          fi

